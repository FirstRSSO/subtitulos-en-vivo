<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Traductor de Audios</title>
  <style>
    :root {
      --fondo: #12141b;
      --texto: #e8ecf4;
      --tenue: #96a0b5;
      --acento: #00ff66;
      --borde: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      background: var(--fondo);
      color: var(--texto);
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 600;
    }

    label {
      display: block;
      margin-bottom: 4px;
      color: var(--tenue);
      font-size: 12px;
    }

    .campo { margin-bottom: 12px; }

    .fila { display: flex; gap: 6px; }

    input, select, button {
      font: inherit;
      color: var(--texto);
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--borde);
      border-radius: 7px;
      padding: 7px 9px;
      outline: none;
    }

    input { flex: 1; min-width: 0; }
    input:focus { border-color: rgba(0, 255, 102, 0.5); }
    select { width: 100%; cursor: pointer; }
    select option { background: var(--fondo); }

    button { cursor: pointer; white-space: nowrap; }
    button:hover { background: rgba(255, 255, 255, 0.14); }

    #btnEscuchar {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      font-weight: 600;
    }

    #btnEscuchar.activo {
      background: rgba(0, 255, 102, 0.16);
      border-color: rgba(0, 255, 102, 0.45);
      color: var(--acento);
    }

    #estado {
      margin-top: 10px;
      min-height: 16px;
      color: var(--tenue);
      font-size: 12px;
      line-height: 1.4;
    }

    #estado.ok { color: var(--acento); }
    #estado.error { color: #ff7b72; }
  </style>
</head>
<body>
  <h1>Traductor de Audios</h1>

  <div class="campo">
    <label for="inpApi">Backend de transcripción</label>
    <div class="fila">
      <input id="inpApi" type="text" spellcheck="false" placeholder="https://....trycloudflare.com/transcribe">
      <button id="btnPegar" title="Pegar desde el portapapeles">Pegar</button>
    </div>
  </div>

  <div class="campo">
    <label for="selIdioma">Traducir a</label>
    <select id="selIdioma">
      <option value="es">Español</option>
      <option value="en">Inglés</option>
      <option value="pt">Portugués</option>
      <option value="fr">Francés</option>
      <option value="de">Alemán</option>
      <option value="it">Italiano</option>
      <option value="ja">Japonés</option>
      <option value="zh">Chino</option>
      <option value="ru">Ruso</option>
    </select>
  </div>

  <button id="btnEscuchar">Iniciar traducción</button>
  <div id="estado"></div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
